<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Cortexa AI · Profile</title>
    <meta name="description" content="Your Cortexa AI profile.">
    <link rel="icon" href="/frontend/assets/logo/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/style.css?v=1.6.1">
    <link rel="stylesheet" href="/frontend/pages.css?v=1.6.1">
</head>
<body class="page">

    <header class="header">
        <div class="header-left">
            <a href="/" class="brand" aria-label="Cortexa AI home">
                <img src="/frontend/assets/logo/logo.svg" alt="" width="28" height="28">
                <span class="wordmark">Cortexa<em>AI</em></span>
            </a>
            <span class="brand-badge">Powered by LangGraph · Groq</span>
        </div>

        <nav class="nav" aria-label="Main">
            <a href="/" class="nav-link">Chat</a>
            <a href="/about" class="nav-link">About</a>
        </nav>

        <div class="header-right">
            <div class="status" id="status" title="Backend status">
                <span class="status-dot"></span>
                <span id="statusText">Checking…</span>
            </div>
            <time class="header-date" id="headerDate"></time>
            <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme">
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <div id="userSlot" class="user-slot"></div>
        </div>
    </header>

    <main class="page-main" id="profilePage">
        <a href="/" class="back-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to chat</a>
        <div class="page-title"><h1>Profile</h1></div>
        <div id="pageContent" aria-live="polite"></div>
    </main>

    <footer class="app-footer">
        <div class="app-footer-brand">Cortexa AI <span aria-hidden="true">·</span> <strong>Multi-agent RAG</strong> assistant</div>
        <div class="app-footer-note">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
            <span>Answers are AI-generated and may not always be 100% accurate. Please verify important results.</span>
        </div>
        <div class="app-footer-credit">Powered by <strong>Cortexa AI</strong> <span aria-hidden="true">·</span> Made by <strong>Sonu Ray</strong></div>
    </footer>

    <script src="/frontend/auth-flows.js?v=1.6.1"></script>
    <script src="/frontend/common.js?v=1.6.1"></script>
    <script src="/frontend/profile.js?v=1.6.1"></script>

</html>
